    <script>
      // ── Stale-index guard ──────────────────────────────────────────────
      // Vite content-hashes every asset, so the ONLY file that can go stale is
      // this document. GitHub Pages serves it with a ~10 minute CDN max-age and
      // offers no way to set cache headers or purge, so after a deploy an open
      // tab — or a fresh load — can keep running the previous build.
      //
      // Ported from tht-crm/index.html, which needs the same treatment for the
      // same reason. scripts/postbuild-pages.mjs stamps 9fd3e76 and writes the
      // matching version.json next to this file.
      //
      // Inert outside a Pages build: `npm run dev` and the Vercel build leave the
      // placeholder in place and have no version.json, so the fetch just fails
      // into the catch and nothing happens.
      window.__APP_V = '9fd3e76';
      (function () {
        function check() {
          fetch('/fulfillment-dashboard-site/version.json?t=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (d) {
              if (!d || !d.v || d.v === window.__APP_V) return;
              // Key the guard on the NEW version: if the CDN is still handing out
              // the old document, this reloads once and then stops rather than
              // looping.
              var k = '__vreload_' + d.v;
              try {
                if (sessionStorage.getItem(k)) return;
                sessionStorage.setItem(k, '1');
              } catch (e) { /* private mode — reload once, unguarded */ }
              location.reload();
            })
            .catch(function () { /* offline or no version.json — ignore */ });
        }
        check();
        document.addEventListener('visibilitychange', function () {
          if (!document.hidden) check();
        });
      })();
    </script>
